# XcodeGen project definition. Regenerate the .xcodeproj with:
#   cd RunWith && xcodegen generate
name: RunWith
options:
  bundleIdPrefix: app.runwith
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  RunCore:
    path: RunCore
  # The Haru Urara companion is parked in Companion/ (see README). To bring her
  # back, restore this package, the Companion sources/resource and the overlay
  # in GearCheckView.
  # GLTFKit2:
  #   url: https://github.com/warrenm/GLTFKit2
  #   from: 0.5.15

targets:
  RunWith:
    type: application
    platform: iOS
    sources:
      - path: RunWithApp
    dependencies:
      - package: RunCore
    info:
      path: RunWithApp/Info.plist
      properties:
        CFBundleDisplayName: Run With
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Background location is the reason this build is native (brief §1).
        UIBackgroundModes:
          - location
        NSLocationWhenInUseUsageDescription: "Run With tracks your route and pace while you run, including when your phone is in your pocket."
        NSMotionUsageDescription: "Run With reads your steps to measure cadence, and to track distance indoors where GPS cannot."
        NSAppleMusicUsageDescription: "Run With notes which song was playing during your run. Only the title and artist are saved, never audio."
        ITSAppUsesNonExemptEncryption: false
        # Spotify connector (Web API, PKCE). Paste the client ID of your Spotify
        # developer app here; its redirect URI must be exactly runwith://spotify.
        SpotifyClientID: "57e35c05ac7e4601938f55d707fd91f4"
        CFBundleURLTypes:
          - CFBundleURLName: app.runwith.capture.spotify
            CFBundleURLSchemes:
              - runwith
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.runwith.capture
        PRODUCT_NAME: RunWith
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        # Set this to your Apple Developer team ID (Xcode > Settings > Accounts),
        # or pick the team in the target's Signing & Capabilities tab.
        DEVELOPMENT_TEAM: YV2FKVKN3T
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
